name: Update xiaosa
on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * *"
  push:
    branches:
      - master
    paths:
      - "tools/**"
jobs:
  xiaosa:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout the branch
        uses: actions/checkout@v7

      # - name: wget the xiaosa
      #   run: |
      #      pwd
      #      cd xiaosa/
      #      wget https://raw.githubusercontent.com/PizazzGY/NewTVBox/main/local/%E5%8D%95%E7%BA%BF%E8%B7%AF.zip -O xiaosa.zip
      #      unzip xiaosa.zip
      #      \cp -pdr TVBoxOSC/tvbox/* ./
      #      rm -rf xiaosa.zip TVBoxOSC
      #      cd ../
      #   shell: bash
      - name: xiaosa tools
        run: |
          pwd
          cd tools/
          pip install demjson3 pycryptodome requests --break-system-packages
          python tvbox.py https://9877.kstore.space/sun.json xs.json dec
          python build_local.py xs.json output
          \cp -pdr output/* ../xiaosa/
          python copy_xbpq.py ./output/api.json
          \cp -pdr ./output/spider.jar ../jar/spider.jar
          rm -rf output xs.json
          cd ../
        shell: bash
      - name: Upload xiaosa artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xiaosa-output
          path: |
            jar/spider.jar
            xiaosa/
            XBPQ/
            XYQHiker/
            json/
            py/
            js/

  git-push:
    needs: [xiaosa]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout the branch
        uses: actions/checkout@v7

      - name: Download xiaosa artifacts
        uses: actions/download-artifact@v8
        with:
          name: xiaosa-output
        continue-on-error: true

      - name: Git push assets to "release" branch
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff-index --quiet HEAD --; then
            git commit -m "更新源 $(date +%Y%m%d%H%M)"
            git push -f origin master
          else
            echo "没有文件更新，不执行 git push"
          fi
